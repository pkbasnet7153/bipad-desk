<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shield Base Background -->
  <path d="M 60,10 C 88,10 108,22 108,48 C 108,82 60,110 60,110 C 60,110 12,82 12,48 C 12,22 32,10 60,10 Z" 
        fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner Protective Shield Ring -->
  <path d="M 60,17 C 82,17 101,27 101,48 C 101,76 60,102 60,102 C 60,102 19,76 19,48 C 19,27 38,17 60,17 Z" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Stylized Mountain Peaks (Himalayas) -->
  <polygon points="28,68 46,42 58,56 74,36 92,68" fill="#F8FAFC" opacity="0.95"/>
  <polygon points="46,42 54,52 58,56 66,48 74,36 82,50 92,68 28,68" fill="#CBD5E1" opacity="0.6"/>

  <!-- Water Wave / River Stream -->
  <path d="M 22,66 Q 40,58 60,66 Q 80,74 98,66 L 98,78 Q 78,86 60,78 Q 40,70 22,78 Z" fill="url(#waterGrad)"/>
  <path d="M 26,76 Q 44,68 60,76 Q 76,84 94,76 L 94,84 Q 76,92 60,84 Q 44,76 26,84 Z" fill="#0284C7" opacity="0.8"/>

  <!-- Emergency Radar / Signal Broadcast Beacon -->
  <circle cx="60" cy="34" r="5" fill="url(#beaconGrad)" filter="url(#glow)"/>
  <path d="M 48,34 A 12,12 0 0,1 72,34" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M 42,34 A 18,18 0 0,1 78,34" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2"/>
</svg>
