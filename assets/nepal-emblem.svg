<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Outer Garland Circle -->
  <circle cx="60" cy="60" r="54" fill="#DC2626" stroke="#991B1B" stroke-width="3"/>
  <circle cx="60" cy="60" r="48" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="44" fill="#0284C7"/>
  
  <!-- Snow Peaks (Himalayas) -->
  <polygon points="25,68 45,40 60,54 75,36 95,68" fill="#F8FAFC"/>
  <polygon points="45,40 52,50 60,54 68,46 75,36 82,50 95,68 25,68" fill="#E2E8F0" opacity="0.7"/>
  
  <!-- Hills & Greenery -->
  <path d="M 20,78 Q 40,62 60,72 Q 80,62 100,78 L 100,90 L 20,90 Z" fill="#16A34A"/>
  
  <!-- River stream -->
  <path d="M 52,72 Q 56,80 60,90 Q 64,80 68,72 Z" fill="#38BDF8"/>

  <!-- Red and White Nepal Flag element -->
  <polygon points="56,22 66,28 58,34 68,40 56,40" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Golden Rhododendron & Laurel Garland outline -->
  <path d="M 22,60 A 38,38 0 0,0 60,98 A 38,38 0 0,0 98,60" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>
  
  <!-- Handshake in bottom foreground -->
  <circle cx="60" cy="88" r="8" fill="#FDE047" stroke="#D97706" stroke-width="1.5"/>
</svg>
